name: Build public majeure PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: pip install reportlab

      - name: Build PDFs
        run: python scripts/build_majeures.py

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-majeures/*.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
            exit 0
          fi
          git commit -m "Build public LexQCM majeure PDFs"
          git push
